name: Deploy Extension

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # PAT 通过 VSCE_PAT 环境变量注入（vsce 默认识别该变量）。
      # 不要把 token 写进命令行参数，会泄漏到 CI 日志。
      #
      # ⚠️ Azure DevOps 的 global PAT 将于 2026-12-01 全部停用。
      #    届时改用 Entra ID + 托管标识：
      #      vsce publish --azure-credential
      #    参见 https://code.visualstudio.com/api/working-with-extensions/publishing-extension#secure-automated-publishing-to-visual-studio-marketplace
      - name: Publish to Visual Studio Marketplace
        run: npx --yes @vscode/vsce publish --no-dependencies
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}

      - name: Package extension
        run: npx --yes @vscode/vsce package --no-dependencies -o ./oj-assistant-plus.vsix

      - name: Create GitHub Release
        run: gh release create "${GITHUB_REF_NAME}" ./oj-assistant-plus.vsix --title "Release ${GITHUB_REF_NAME}" --prerelease
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
